name: lucky_games
description: A colorful three-map match-3 puzzle game.
publish_to: "none"
version: 1.0.12+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  airbridge_flutter_sdk: 4.10.0
  flutter:
    sdk: flutter
  http: 1.6.0
  shared_preferences: ^2.5.3
  webview_flutter: 4.14.1
  webview_flutter_android: 4.14.0
  webview_flutter_wkwebview: 3.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - airbridge.json
    - assets/airbridge_bridge.js
    - img/icon-1024.png
